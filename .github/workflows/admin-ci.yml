name: Admin CI

on:
  push:
    branches: [ main, feat/admin-next-scaffold ]
    paths:
      - 'admin/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: admin
        run: npm ci

      - name: Lint
        working-directory: admin
        run: npm run lint --if-present

      - name: Build
        working-directory: admin
        run: npm run build

      - name: Run tests (if any)
        working-directory: admin
        run: |
          if npm test --silent; then echo "Tests passed"; else echo "No tests or tests failed"; fi
